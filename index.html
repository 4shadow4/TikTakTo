<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="container">
        <h1>Tik-Tak-Toe</h1>
        <div>
            <div>
                <h3 id="Player1"></h3>
                <p id="scorePl1"></p>
            </div>
            <div>
                <h3 id="Player2"></h3>
                <p id="scorePl2"></p>
            </div>
        </div>
        <div id="tiktaktoe">
            
        </div>
        <div>
            <a href="https://www.flaticon.com/free-icons/close" title="close icons">Close icons created by Pixel perfect - Flaticon</a>
            <a href="https://www.flaticon.com/free-icons/circular" title="circular icons">Circular icons created by riajulislam - Flaticon</a>
        </div>
        <div>
            <button id="newMatch">New Match</button>
            <button id="newGame">New Game</button>
        </div>

    </div>
    
    <div id="startGame">    
        <form id="form">
            <p>
                <label for="pl1name">Name of Player 1</label>
                <input type="text" name="pl1name" id="pl1name" required>
            </p>
            <p>
                <label for="pl2name">Name of Player 2</label>
                <input type="text" name="pl2name" id="pl2name" required>
            </p>
            <button type="submit">Start</button>
        </form>

    </div>
    <script src="./script.js"></script>
</body>
</html>
